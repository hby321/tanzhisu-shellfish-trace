<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>滩智溯 - 辽宁寒地滩涂贝类智慧养殖溯源平台</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1f2e;
      }

      /* 手机外框 - 作用于 Taro TabBar 容器 */
      .taro-tabbar__container {
        width: 375px !important;
        height: 812px !important;
        position: absolute;
        top: 50%;
        left: 50%;
        transform-origin: center center;
        transform: translate(-50%, -50%);
        overflow: hidden;
        border-radius: 40px;
        box-shadow:
          0 0 0 3px #333,
          0 0 0 6px #1a1a2e,
          0 0 0 10px #0d0d1a,
          0 40px 80px rgba(0,0,0,0.6),
          0 0 120px rgba(14, 165, 233, 0.08);
        background: #fff;
        display: flex !important;
        flex-direction: column !important;
      }

      /* 导航栏（隐藏） */
      .taro-navigation-bar-no-icon {
        display: none !important;
      }

      /* 内容面板 - 占满剩余空间，内部可滚动 */
      .taro-tabbar__panel {
        flex: 1 !important;
        min-height: 0 !important;
        height: 0 !important;
        width: 100% !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
      }

      /* #app 充满面板，内容超出时可滚动 */
      #app.taro_router {
        width: 100% !important;
        min-height: 100% !important;
        position: relative !important;
        top: auto !important;
        left: auto !important;
        transform: none !important;
        overflow: visible !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
      }

      /* 覆盖 Taro 默认样式：让 .taro_page 充满面板高度，不受 100vh 限制 */
      .taro_router {
        height: 100% !important;
        position: relative !important;
      }
      .taro_router > .taro_page {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        max-height: none !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }
      /* 给使用 TabBar 的页面增加底部间距，防止 TabBar 遮挡 */
      .taro_router > .taro_page.taro_tabbar_page {
        padding-bottom: 60px !important;
      }
      .taro-tabbar__container > .taro-tabbar__panel {
        overflow: visible !important;
      }

      /* 刘海屏 */
      .phone-notch {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 120px;
        height: 28px;
        background: #111;
        border-radius: 0 0 20px 20px;
        transform-origin: center center;
        pointer-events: none;
        z-index: 9999;
      }
    </style>
    <script>
      // 固定 html fontSize，防止 flexible 脚本动态修改
      (function() {
        var html = document.documentElement;
        html.style.fontSize = '18px';
        Object.defineProperty(html.style, 'fontSize', {
          get: function() { return '18px'; },
          set: function() { /* 忽略所有修改 */ }
        });
      })();

      // 手机外框自适应缩放
      (function() {
        var PHONE_H = 812;

        function scaleApp() {
          var vh = window.innerHeight;
          var vw = window.innerWidth;
          var scale = (vh * 0.85) / PHONE_H;
          var maxWScale = (vw * 0.50) / 375;
          scale = Math.min(scale, maxWScale);
          scale = Math.max(0.3, Math.min(scale, 2));

          var container = document.querySelector('.taro-tabbar__container');
          var notch = document.querySelector('.phone-notch');
          if (container) {
            container.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
          }
          if (notch) {
            notch.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
            var notchTop = -(PHONE_H / 2) + 14 + 28;
            notch.style.marginTop = notchTop + 'px';
          }
        }

        function init() {
          scaleApp();
          window.addEventListener('resize', scaleApp);
          window.addEventListener('orientationchange', scaleApp);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
        setTimeout(init, 300);
        setTimeout(init, 1000);
        setTimeout(init, 2000);
      })();

      <%= htmlWebpackPlugin.options.script %>
    </script>
  </head>
  <body>
    <div class="phone-notch"></div>
  </body>
</html>
